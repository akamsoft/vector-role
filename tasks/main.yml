---
- name: Ensure install directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ vector_install_dir }}"
    - "{{ vector_config_dir }}"
    - "{{ vector_data_dir }}"
  tags: vector_install

- name: Download Vector archive
  ansible.builtin.get_url:
    url: "{{ vector_download_url }}"
    dest: "/tmp/{{ vector_archive }}"
    mode: '0644'
  tags: vector_install

- name: Unarchive Vector
  ansible.builtin.unarchive:
    src: "/tmp/{{ vector_archive }}"
    dest: "{{ vector_install_dir }}"
    remote_src: true
    creates: "{{ vector_bin }}"
    owner: root
    group: root
  tags: vector_install

- name: Symlink vector binary to /usr/local/bin
  ansible.builtin.file:
    src: "{{ vector_bin }}"
    dest: /usr/local/bin/vector
    state: link
    force: true
    follow: false
  tags: vector_install

- name: Deploy Vector configuration
  ansible.builtin.template:
    src: vector.yml.j2
    dest: "{{ vector_config_dir }}/vector.yaml"
    owner: root
    group: root
    mode: '0644'
  notify: Restart vector service
  tags: vector_configure

- name: Deploy Vector systemd unit
  ansible.builtin.template:
    src: vector.service.j2
    dest: /etc/systemd/system/vector.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart vector service
  tags: vector_configure

- name: Ensure Vector is started and enabled
  ansible.builtin.systemd:
    name: "{{ vector_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
  tags: vector_configure
