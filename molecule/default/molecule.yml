---
dependency:
  name: galaxy
driver:
  name: default
platforms:                      # ← на верхнем уровне, без отступа перед словом
  - name: instance-oraclelinux-9
    image: "mpaivabarbosa/molecule-systemd-oraclelinux:9"
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /usr/sbin/init
    tmpfs:
      - /run
    ansible_python_interpreter: /usr/bin/python3.9
  - name: instance-ubuntu-latest
    image: "buluma/docker-molecule-images:ubuntu_latest"
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /sbin/init
    tmpfs:
      - /run
provisioner:
  name: ansible
  config_options:
    defaults:
      remote_tmp: /tmp
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
verifier:
  name: ansible