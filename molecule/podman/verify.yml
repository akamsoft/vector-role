---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check Vector binary
      ansible.builtin.stat:
        path: "{{ vector_bin | default('/usr/local/bin/vector') }}"
      register: vector_bin_stat

    - name: Assert binary exists and executable
      ansible.builtin.assert:
        that:
          - vector_bin_stat.stat.exists
          - vector_bin_stat.stat.executable
        fail_msg: "Vector binary is missing!"

    - name: Check Vector service
      ansible.builtin.command: systemctl is-active vector
      register: vector_service_status
      changed_when: false
      failed_when: false

    - name: Assert service is running
      ansible.builtin.assert:
        that:
          - vector_service_status.stdout == "active"
        fail_msg: "Vector service is not running: {{ vector_service_status.stdout }}"
